# ============================================================
# RevConnect — Production Profile (AWS EC2 + RDS + SES)
# Activate with: --spring.profiles.active=prod
# ============================================================

server.port=${SERVER_PORT:8080}

# --- Database (AWS RDS MySQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://revconnect-db.cx4g0gscupd7.ap-south-1.rds.amazonaws.com:3306/revconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:Password123!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Timezone & Jackson ---
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# --- JWT ---
jwt.secret=${JWT_SECRET:RevConnectSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024}
jwt.expiration=86400000

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Logging (production: less verbose) ---
logging.level.org.revature.revconnect=INFO
logging.level.org.springframework.security=WARN
logging.file.name=/tmp/revconnect/app.log

# --- File Uploads ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Brevo REST API (HTTPS port 443 - works on Render free tier) ---
brevo.api.key=${BREVO_API_KEY:}
